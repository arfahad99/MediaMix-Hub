<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>MediaMix Hub - Authentication Test</h1>
    
    <div class="test-section">
        <h2>Authentication Status</h2>
        <p id="authStatus">Checking...</p>
        <p id="userInfo"></p>
    </div>
    
    <div class="test-section">
        <h2>Test Login</h2>
        <button onclick="testLogin()">Test Login (demo@mediamix.com)</button>
        <button onclick="testLogout()">Test Logout</button>
        <p id="loginResult"></p>
    </div>
    
    <div class="test-section">
        <h2>Navigation Test</h2>
        <button onclick="goToLogin()">Go to Login Page</button>
        <button onclick="goToMain()">Go to Main App</button>
    </div>

    <script src="Front-End/data-models.js"></script>
    <script src="Front-End/auth.js"></script>
    <script>
        // Test authentication functionality
        function checkAuthStatus() {
            const isAuth = authManager.isAuthenticated();
            const user = authManager.getCurrentUser();
            
            document.getElementById('authStatus').innerHTML = isAuth 
                ? '<span class="success">✓ Authenticated</span>' 
                : '<span class="error">✗ Not Authenticated</span>';
                
            if (user) {
                document.getElementById('userInfo').innerHTML = 
                    `User: ${user.name} (${user.email})`;
            } else {
                document.getElementById('userInfo').innerHTML = 'No user data';
            }
        }
        
        async function testLogin() {
            const result = await authManager.login('demo@mediamix.com', 'demo123');
            document.getElementById('loginResult').innerHTML = result.success 
                ? '<span class="success">✓ Login successful</span>'
                : `<span class="error">✗ Login failed: ${result.error}</span>`;
            checkAuthStatus();
        }
        
        function testLogout() {
            const success = authManager.logout();
            document.getElementById('loginResult').innerHTML = success 
                ? '<span class="success">✓ Logout successful</span>'
                : '<span class="error">✗ Logout failed</span>';
            checkAuthStatus();
        }
        
        function goToLogin() {
            window.location.href = 'Front-End/login.html';
        }
        
        function goToMain() {
            window.location.href = 'Front-End/index.html';
        }
        
        // Initialize
        checkAuthStatus();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Success - MediaMix Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .success-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .success-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }
        
        .success-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 1rem;
        }
        
        .success-message {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-container {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
            display: none;
        }
        
        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1rem;
        }
        
        .retry-btn:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1 class="success-title">Authentication Successful!</h1>
        <p class="success-message">
            <span class="loading-spinner"></span>
            Processing your login and redirecting to MediaMix Hub...
        </p>
        <div id="errorContainer" class="error-container">
            <p id="errorMessage"></p>
            <button class="retry-btn" onclick="retryLogin()">Try Again</button>
        </div>
    </div>

    <script>
        // Get token from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const state = urlParams.get('state');
        const error = urlParams.get('error');

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorContainer').style.display = 'block';
            document.querySelector('.success-message').style.display = 'none';
        }

        function retryLogin() {
            window.location.href = '/login-backend.html';
        }

        // Handle authentication result
        if (error) {
            showError('Authentication failed: ' + error);
        } else if (token) {
            // Store token and redirect
            localStorage.setItem('authToken', token);
            
            // Redirect to main app after short delay
            setTimeout(() => {
                window.location.href = '/index-backend.html';
            }, 2000);
        } else {
            showError('No authentication token received. Please try logging in again.');
        }

        // Auto-redirect to login if no token after 5 seconds
        setTimeout(() => {
            if (!token && !error) {
                window.location.href = '/login-backend.html';
            }
        }, 5000);
    </script>
</body>
</html>

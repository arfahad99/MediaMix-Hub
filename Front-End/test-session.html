<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Test - MediaMix Hub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 10px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>MediaMix Hub - Session Management Test</h1>
    
    <div class="test-section">
        <h2>Current Session Status</h2>
        <button onclick="checkSession()">Check Current Session</button>
        <div id="sessionStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>Token Information</h2>
        <button onclick="showTokenInfo()">Show Token Details</button>
        <div id="tokenInfo"></div>
    </div>
    
    <div class="test-section">
        <h2>Session Actions</h2>
        <button onclick="clearSession()">Clear Session (Logout)</button>
        <button onclick="testExpiredToken()">Test Expired Token Handling</button>
        <div id="actionResults"></div>
    </div>
    
    <div class="test-section">
        <h2>Navigation</h2>
        <button onclick="goToLogin()">Go to Login Page</button>
        <button onclick="goToMainApp()">Go to Main App</button>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        
        // Token validation utility (copied from app-backend.js)
        const TokenValidator = {
            isTokenExpired(token) {
                if (!token) return true;
                
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const currentTime = Math.floor(Date.now() / 1000);
                    return payload.exp < (currentTime + 300);
                } catch (error) {
                    console.error('Error checking token expiration:', error);
                    return true;
                }
            },
            
            getTokenTimeRemaining(token) {
                if (!token) return 0;
                
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const currentTime = Math.floor(Date.now() / 1000);
                    return Math.max(0, payload.exp - currentTime);
                } catch (error) {
                    return 0;
                }
            }
        };
        
        function checkSession() {
            const statusDiv = document.getElementById('sessionStatus');
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                statusDiv.innerHTML = '<div class="status error">❌ No session found - User not logged in</div>';
                return;
            }
            
            const isExpired = TokenValidator.isTokenExpired(token);
            const timeRemaining = TokenValidator.getTokenTimeRemaining(token);
            
            if (isExpired) {
                statusDiv.innerHTML = '<div class="status error">❌ Session expired</div>';
            } else {
                const hours = Math.floor(timeRemaining / 3600);
                const minutes = Math.floor((timeRemaining % 3600) / 60);
                statusDiv.innerHTML = `
                    <div class="status success">
                        ✅ Session active<br>
                        Time remaining: ${hours}h ${minutes}m
                    </div>
                `;
            }
        }
        
        function showTokenInfo() {
            const infoDiv = document.getElementById('tokenInfo');
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                infoDiv.innerHTML = '<div class="status error">No token found</div>';
                return;
            }
            
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const issuedAt = new Date(payload.iat * 1000);
                const expiresAt = new Date(payload.exp * 1000);
                
                infoDiv.innerHTML = `
                    <div class="status info">
                        <strong>Token Information:</strong><br>
                        User ID: ${payload.userId}<br>
                        Issued: ${issuedAt.toLocaleString()}<br>
                        Expires: ${expiresAt.toLocaleString()}<br>
                        Token Length: ${token.length} characters
                    </div>
                `;
            } catch (error) {
                infoDiv.innerHTML = '<div class="status error">Error parsing token</div>';
            }
        }
        
        function clearSession() {
            localStorage.removeItem('authToken');
            document.getElementById('actionResults').innerHTML = 
                '<div class="status success">✅ Session cleared successfully</div>';
        }
        
        function testExpiredToken() {
            // Create a fake expired token for testing
            const expiredPayload = {
                userId: 'test123',
                iat: Math.floor(Date.now() / 1000) - 3600, // 1 hour ago
                exp: Math.floor(Date.now() / 1000) - 1800   // 30 minutes ago (expired)
            };
            
            const fakeToken = 'fake.' + btoa(JSON.stringify(expiredPayload)) + '.fake';
            localStorage.setItem('authToken', fakeToken);
            
            document.getElementById('actionResults').innerHTML = 
                '<div class="status info">🧪 Fake expired token set. Try checking session or going to main app.</div>';
        }
        
        function goToLogin() {
            window.open('http://localhost:3000/login-backend.html', '_blank');
        }
        
        function goToMainApp() {
            window.open('http://localhost:3000/index-backend.html', '_blank');
        }
        
        // Auto-check session on load
        window.addEventListener('load', () => {
            checkSession();
        });
    </script>
</body>
</html>

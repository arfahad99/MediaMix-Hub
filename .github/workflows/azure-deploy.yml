name: Deploy MediaMix Hub to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: mediamix-hub-rg
  BACKEND_APP_NAME: mediamix-hub-api
  FRONTEND_APP_NAME: mediamix-hub-frontend
  FUNCTION_APP_NAME: mediamix-hub-functions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend-nextjs/package-lock.json
          azure-functions/package-lock.json
        
    - name: 🔐 Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        
    - name: 🏗️ Build Backend
      run: |
        cd backend
        npm ci
        npm run test --if-present
        
    - name: 🎨 Build Frontend
      run: |
        cd frontend-nextjs
        npm ci
        npm run build
        
    - name: ⚡ Build Azure Functions
      run: |
        cd azure-functions
        npm ci
        npm run build
        
    - name: 🚀 Deploy Backend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.BACKEND_APP_NAME }}
        package: ./backend
        
    - name: 🎨 Deploy Frontend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.FRONTEND_APP_NAME }}
        package: ./frontend-nextjs
        
    - name: ⚡ Deploy Azure Functions
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.FUNCTION_APP_NAME }}
        package: ./azure-functions
        
    - name: 📊 Update Application Insights
      run: |
        # Create custom events for deployment tracking
        az rest --method POST \
          --url "https://api.applicationinsights.io/v1/apps/${{ secrets.APPINSIGHTS_APP_ID }}/events/customEvents" \
          --headers "X-API-Key=${{ secrets.APPINSIGHTS_API_KEY }}" \
          --body '{
            "name": "Deployment",
            "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)'",
            "properties": {
              "version": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}",
              "environment": "production"
            }
          }'
          
    - name: 🧪 Run Health Checks
      run: |
        # Wait for deployments to complete
        sleep 60
        
        # Check backend health
        backend_status=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net/api/health || echo "000")
        echo "Backend health check: $backend_status"
        
        # Check frontend health
        frontend_status=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.FRONTEND_APP_NAME }}.azurewebsites.net || echo "000")
        echo "Frontend health check: $frontend_status"
        
        # Check function app health
        function_status=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net || echo "000")
        echo "Function app health check: $function_status"
        
        # Fail if any service is not healthy
        if [ "$backend_status" != "200" ] || [ "$frontend_status" != "200" ] || [ "$function_status" != "200" ]; then
          echo "❌ Health checks failed"
          exit 1
        else
          echo "✅ All services are healthy"
        fi
        
    - name: 📈 Performance Test
      run: |
        # Basic performance test using curl
        echo "Running performance tests..."
        
        # Test API response time
        api_time=$(curl -s -w "%{time_total}" -o /dev/null https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net/api/health)
        echo "API response time: ${api_time}s"
        
        # Test frontend load time
        frontend_time=$(curl -s -w "%{time_total}" -o /dev/null https://${{ env.FRONTEND_APP_NAME }}.azurewebsites.net)
        echo "Frontend load time: ${frontend_time}s"
        
        # Alert if response times are too high
        if (( $(echo "$api_time > 2.0" | bc -l) )); then
          echo "⚠️ API response time is high: ${api_time}s"
        fi
        
    - name: 🔔 Notify Deployment Status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment completed successfully!"
          echo "🌐 Frontend: https://${{ env.FRONTEND_APP_NAME }}.azurewebsites.net"
          echo "🔧 Backend: https://${{ env.BACKEND_APP_NAME }}.azurewebsites.net"
          echo "⚡ Functions: https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net"
        else
          echo "❌ Deployment failed!"
        fi

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Run security audit
      run: |
        cd backend
        npm audit --audit-level moderate
        
        cd ../frontend-nextjs
        npm audit --audit-level moderate
        
        cd ../azure-functions
        npm audit --audit-level moderate
        
    - name: 🛡️ Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
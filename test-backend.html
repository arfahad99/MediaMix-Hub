<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaMix Hub - Backend Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 10px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>MediaMix Hub - Backend Connection Test</h1>
    
    <div class="test-section">
        <h2>Backend API Status</h2>
        <button onclick="testBackendConnection()">Test Backend Connection</button>
        <div id="backendStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Registration</h2>
        <button onclick="testRegistration()">Test User Registration</button>
        <div id="registrationStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Login</h2>
        <button onclick="testLogin()">Test User Login</button>
        <div id="loginStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>Navigation</h2>
        <button onclick="openLoginPage()">Open Login Page</button>
        <button onclick="openMainApp()">Open Main App (Backend Version)</button>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        
        async function testBackendConnection() {
            const statusDiv = document.getElementById('backendStatus');
            statusDiv.innerHTML = 'Testing connection...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ Backend Connected Successfully!<br>
                            Environment: ${data.environment}<br>
                            Timestamp: ${data.timestamp}
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `<div class="status error">❌ Backend responded but with error</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Connection Failed: ${error.message}</div>`;
            }
        }
        
        async function testRegistration() {
            const statusDiv = document.getElementById('registrationStatus');
            statusDiv.innerHTML = 'Testing registration...';
            
            const testUser = {
                name: 'Test User',
                email: `test${Date.now()}@example.com`,
                password: 'testpass123'
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testUser)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ Registration Successful!<br>
                            User: ${data.user.name}<br>
                            Email: ${data.user.email}<br>
                            Token received: ${data.token ? 'Yes' : 'No'}
                        </div>
                    `;
                    
                    // Store for login test
                    window.testUserEmail = testUser.email;
                    window.testUserPassword = testUser.password;
                } else {
                    statusDiv.innerHTML = `<div class="status error">❌ Registration Failed: ${data.message}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Registration Error: ${error.message}</div>`;
            }
        }
        
        async function testLogin() {
            const statusDiv = document.getElementById('loginStatus');
            
            if (!window.testUserEmail) {
                statusDiv.innerHTML = `<div class="status error">❌ Please run registration test first</div>`;
                return;
            }
            
            statusDiv.innerHTML = 'Testing login...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: window.testUserEmail,
                        password: window.testUserPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ Login Successful!<br>
                            User: ${data.user.name}<br>
                            Token received: ${data.token ? 'Yes' : 'No'}
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `<div class="status error">❌ Login Failed: ${data.message}</div>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Login Error: ${error.message}</div>`;
            }
        }
        
        function openLoginPage() {
            window.open('http://localhost:3000/login-backend.html', '_blank');
        }
        
        function openMainApp() {
            window.open('http://localhost:3000/index-backend.html', '_blank');
        }
        
        // Auto-test backend connection on load
        window.addEventListener('load', () => {
            testBackendConnection();
        });
    </script>
</body>
</html>
